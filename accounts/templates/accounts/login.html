{% extends "base.html" %}

{% block title %}로그인 | BI CLOUD SaaS{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 relative">
  
  <!-- Subtle Gradient Background Glow -->
  <div class="absolute w-96 h-96 bg-zinc-800/40 rounded-full blur-3xl pointer-events-none -z-10 -top-10"></div>

  <div class="w-full max-w-md space-y-8">
    
    <!-- Header -->
    <div class="text-center space-y-3">
      <div class="inline-flex w-12 h-12 rounded-2xl bg-white text-black font-black text-xl items-center justify-center shadow-xl shadow-white/5 mb-2">
        BI
      </div>
      <h2 class="text-3xl font-extrabold tracking-tight text-white">
        BI CLOUD 통합 로그인
      </h2>
      <p class="text-sm text-zinc-400">
        AI 뉴스 큐레이션 & 실시간 글로벌 환율 인텔리전스
      </p>
    </div>

    <!-- Login Form Card -->
    <div class="bw-card p-8 sm:p-10 space-y-6">
      
      <form method="POST" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="space-y-5">
        {% csrf_token %}

        <div class="space-y-1.5">
          <label for="username" class="block text-xs font-mono font-semibold text-zinc-300 uppercase tracking-wider">
            계정 이메일 또는 아이디
          </label>
          <div class="relative">
            <input type="text" name="username" id="username" required autofocus 
              placeholder="ethan@ncomputing.com" 
              class="w-full px-4 py-3 bw-input font-medium text-sm text-white placeholder-zinc-600">
          </div>
        </div>

        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="password" class="block text-xs font-mono font-semibold text-zinc-300 uppercase tracking-wider">
              비밀번호
            </label>
          </div>
          <div class="relative">
            <input type="password" name="password" id="password" required 
              placeholder="••••••••" 
              class="w-full px-4 py-3 bw-input font-medium text-sm text-white placeholder-zinc-600">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 px-4 bw-btn-primary flex items-center justify-center gap-2 text-sm font-bold shadow-lg shadow-white/5 mt-2">
          <span>SaaS 시스템 접속하기</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>

      <!-- Enterprise Security Notice -->
      <div class="pt-2 text-center">
        <p class="text-xs text-zinc-500 flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <span>인증된 임직원 및 인가된 파트너만 접근 가능합니다.</span>
        </p>
      </div>

    </div>


    <!-- SaaS Footer -->
    <div class="text-center text-xs text-zinc-600 font-mono">
      Enterprise Business Intelligence Cloud Engine
    </div>

  </div>
</div>
{% endblock %}
