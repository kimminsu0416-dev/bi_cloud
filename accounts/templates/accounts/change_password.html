{% extends "base.html" %}

{% block title %}비밀번호 변경 | BI CLOUD SaaS{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-12">
  <div class="space-y-6">
    
    <div>
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-zinc-700 text-xs font-mono text-zinc-400 mb-2">
        <span>SECURITY SETTINGS</span>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">
        계정 비밀번호 변경
      </h1>
      <p class="text-sm text-zinc-400 mt-1">
        보안 강화를 위해 현재 사용 중인 비밀번호를 새로운 비밀번호로 변경합니다.
      </p>
    </div>

    <div class="bw-card p-8 space-y-6">
      <div class="flex items-center gap-3 p-3.5 bg-zinc-900/90 rounded-xl border border-zinc-800 text-xs text-zinc-300">
        <span class="font-mono font-bold text-white">현재 계정:</span>
        <span class="font-mono text-zinc-400">{{ user.email|default:user.username }}</span>
      </div>

      <form method="POST" action="{% url 'accounts:change_password' %}" class="space-y-5">
        {% csrf_token %}

        <div class="space-y-1.5">
          <label for="current_password" class="block text-xs font-mono font-semibold text-zinc-300 uppercase">
            현재 비밀번호
          </label>
          <input type="password" name="current_password" id="current_password" required 
            placeholder="현재 사용 중인 비밀번호 (예: ncom1234)" 
            class="w-full px-4 py-3 bw-input font-medium text-sm text-white">
        </div>

        <div class="space-y-1.5">
          <label for="new_password" class="block text-xs font-mono font-semibold text-zinc-300 uppercase">
            새 비밀번호
          </label>
          <input type="password" name="new_password" id="new_password" required minlength="6"
            placeholder="새로운 비밀번호 (최소 6자 이상)" 
            class="w-full px-4 py-3 bw-input font-medium text-sm text-white">
        </div>

        <div class="space-y-1.5">
          <label for="confirm_password" class="block text-xs font-mono font-semibold text-zinc-300 uppercase">
            새 비밀번호 확인
          </label>
          <input type="password" name="confirm_password" id="confirm_password" required minlength="6"
            placeholder="새로운 비밀번호 다시 입력" 
            class="w-full px-4 py-3 bw-input font-medium text-sm text-white">
        </div>

        <div class="pt-3 flex items-center justify-between gap-4">
          <a href="/" class="px-5 py-3 bw-btn-secondary text-sm font-semibold transition">
            취소 및 돌아가기
          </a>
          <button type="submit" class="px-6 py-3 bw-btn-primary text-sm font-bold shadow-lg shadow-white/5 transition">
            비밀번호 변경 완료
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
